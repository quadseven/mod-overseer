# The lane pre-PR check: the pull-request gate in
# .github/workflows/check.decisions.yml, run through scripts/check-locally.sh.
# The adapter check needs the full core toolchain, which lanes do not have.
# The decisions mode does not run tests/replay_run_family_migration.py: the
# gate runs it against a MySQL service, and its local form is the separate
# `bash scripts/check-locally.sh schema` mode. A lane can pass here and
# still be red on the gate's MySQL step (#1346).
interpreter: python3
check: bash scripts/check-locally.sh decisions
