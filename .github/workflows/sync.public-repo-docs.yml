name: sync.public-repo-docs

# Thin caller for the reusable public-repo AGENTS.md/CLAUDE.md sync
# (infra#2953). Keeps this repo's copies in sync with the canonical ones at
# quadseven/infra-public/templates/public-repo/ - see that workflow's own
# comments for the full mechanism.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

jobs:
  sync:
    uses: quadseven/infra-public/.github/workflows/sync.public-repo-docs.yml@caa16ebe1116551eacd8ff9a74441b81525dd83a
    permissions:
      contents: write
      pull-requests: write
