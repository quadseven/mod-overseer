# Compile the pure decisions on their own, and run what they decide.
#
# WHY THIS IS A SEPARATE WORKFLOW FROM build.yml. That one proves the module
# compiles against the pinned core, which means cloning AzerothCore and
# mod-playerbots and building the whole server - tens of minutes even warm, and
# it runs on a push to main rather than on a pull request. This one compiles two
# files with the runner's own g++ and finishes in seconds, so a decision that
# has been got wrong is said before a review starts rather than after a merge.
#
# THE FILE LIST IS THE TEST. src/overseer_decisions.{h,cpp} include <ctime>,
# <string> and <vector> and nothing else, on purpose: the header says a reader
# or a test "can compile these two on their own", and until this existed nothing
# in this repository ever did. So the compile line below names exactly those
# files and no include path into a core - if an AzerothCore type ever gets into
# one of these decisions, this job stops compiling, which is the property being
# protected. It is not incidental to the test; it IS half of it.
name: The pure decisions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

# Keyed on the ref rather than shared with build.yml's single `build` group: a
# second push to the same pull request should cancel the first run of this, and
# should not queue behind an unrelated build of main.
concurrency:
  group: decisions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Least privilege, and it is genuinely the least: this job clones the
    # repository, compiles two files and runs the binary. It writes nothing
    # anywhere, so contents: read is the whole of what it needs. Named
    # explicitly rather than inherited, because the repository default is a
    # setting somebody can change without ever reading this file.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # -Wall -Wextra because this is the one translation unit in the module
      # whose warnings are not drowned out by a core's own, so they are cheap
      # to keep clean here and worth having.
      #
      # ONE BINARY PER TEST FILE, over whatever tests/ holds. Each of these
      # files owns a main() and they cannot be linked together, and naming them
      # one at a time here means the next decision that gets a test is a
      # decision whose test silently never runs until somebody remembers to
      # edit this file. The loop changes nothing about WHAT is compiled: still
      # src/overseer_decisions.cpp plus one test file, still no include path
      # into a core, which is the half of this job that IS the test. An empty
      # tests/ fails rather than passing vacuously, for the same reason.
      # The version exists twice on purpose: `VERSION` at the root is what a
      # human reads and what a release is cut from, and the constant in the pure
      # header is what the module can report at runtime without dragging a core
      # in behind it. Two copies of a string is exactly the thing that drifts
      # silently, and a wrong version in a build banner is worse than none
      # because it is believed. So they are compared here, where it costs a
      # second, rather than discovered from a page showing the wrong number.
      - name: The two version strings agree
        run: |
          set -euo pipefail
          file="$(tr -d '[:space:]' < VERSION)"
          header="$(grep -oE '^constexpr char VERSION\[\] = "[^"]+"' src/overseer_decisions.h | grep -oE '"[^"]+"' | tr -d '"')"
          echo "VERSION file:    $file"
          echo "header constant: $header"
          test -n "$file"   || { echo '::error::VERSION file is empty'; exit 1; }
          test -n "$header" || { echo '::error::no VERSION constant in src/overseer_decisions.h'; exit 1; }
          test "$file" = "$header" || { echo "::error::version drift: VERSION=$file header=$header"; exit 1; }
          printf '%s\n' "$file" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::not semver: $file"; exit 1; }
      - name: Compile and run
        run: |
          set -euo pipefail
          g++ --version | head -1
          shopt -s nullglob
          found=0
          for test in tests/test_*.cpp; do
            found=1
            name="$(basename "$test" .cpp)"
            echo "== $test"
            g++ -std=c++17 -Wall -Wextra -Isrc src/overseer_decisions.cpp "$test" -o "$name"
            "./$name"
          done
          test "$found" = 1 || { echo "no tests/test_*.cpp found"; exit 1; }
